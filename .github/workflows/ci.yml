name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # **2026-07-27にTS実装を撤去した**ので、以前あった `test` ジョブ(bun test / tsc --noEmit /
  # TS版CLIでのexamples実行)は無くなった。playgroundはTSのまま残るので型検査だけは続ける。
  playground-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9 # mise.toml と揃える

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      # 開発フローを守るフック（.claude/hooks/）のテスト。ネットワーク・gh認証に
      # 依存しない。走らせておかないと、フックが無言で効かなくなっても気づけない
      - name: Hook tests
        run: .claude/hooks/test-hooks.sh

  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1" # mise.toml と揃える
          components: clippy

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # playgroundが読むwasm(TS撤去 段階4)。**ビルドが壊れてもCLIのテストは通る**ので、
      # ここで明示的にビルドしないとplaygroundだけ静かに動かなくなる
      - name: Build wasm (playground)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --lib --release

  # **TS版(オラクル)とRust版を突き合わせる**(撤去条件(5)=両実装の並走確認)。
  # bunとcargoの両方が要るので独立したjobにしてある。
  #
  # これを入れるまで、CIは`bun test`と`cargo test`を別々に走らせるだけで
  # **両実装の出力を一度も比べていなかった**——parity/sweepは手元でしか回っておらず、
  # 「並走で差分ゼロ」を機械的に保証できていなかった(docs/ts-removal-plan.md 段階1)。
  # 診断・生成JSの退行検出(撤去条件(5)の名残)。
  # **撤去前はTS版(オラクル)との突き合わせだった**が、いまは撤去時点の出力を凍結した
  # 記録との突き合わせ。役割(生成物の退行検出)は同じ
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1" # mise.toml と揃える

      - name: Build Rust CLI
        run: cargo build --manifest-path rust/Cargo.toml

      - name: Parity (diagnostics snapshots)
        run: scripts/parity.sh

      - name: Sweep (combination probes)
        run: scripts/sweep.sh

      - name: Run examples
        run: scripts/run-examples.sh
