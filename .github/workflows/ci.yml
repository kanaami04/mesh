name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9 # mise.toml と揃える

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      # 開発フローを守るフック（.claude/hooks/）のテスト。ネットワーク・gh認証に
      # 依存しない。走らせておかないと、フックが無言で効かなくなっても気づけない
      - name: Hook tests
        run: .claude/hooks/test-hooks.sh

      # 「どの例が意図的に落ちるか」の判定は scripts/run-examples.sh に集約してある
      # (以前は mise.toml とこのワークフローに同じ判定が二重に書かれていた)
      - name: Run examples
        run: scripts/run-examples.sh

  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1" # mise.toml と揃える
          components: clippy

      - name: Build
        run: cargo build

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # playgroundが読むwasm(TS撤去 段階4)。**ビルドが壊れてもCLIのテストは通る**ので、
      # ここで明示的にビルドしないとplaygroundだけ静かに動かなくなる
      - name: Build wasm (playground)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --lib --release

  # **TS版(オラクル)とRust版を突き合わせる**(撤去条件(5)=両実装の並走確認)。
  # bunとcargoの両方が要るので独立したjobにしてある。
  #
  # これを入れるまで、CIは`bun test`と`cargo test`を別々に走らせるだけで
  # **両実装の出力を一度も比べていなかった**——parity/sweepは手元でしか回っておらず、
  # 「並走で差分ゼロ」を機械的に保証できていなかった(docs/ts-removal-plan.md 段階1)。
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9 # mise.toml と揃える

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1" # mise.toml と揃える

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Rust CLI
        run: cargo build --manifest-path rust/Cargo.toml

      # 診断・生成JSともTS版と一致するか(Rust側だけに出る診断があれば失敗)
      - name: Parity (diagnostics + generated JS)
        run: scripts/parity.sh

      # parityが測れない「形の組み合わせ」(milestone 65の誤検知5種はこれだった)
      - name: Sweep (combination probes)
        run: scripts/sweep.sh

      # examplesを**Rust版CLIでも**実行する(testジョブはTS版で走らせている)。
      # parityはcheckと生成JSまでで、実行時の挙動までは見ないため
      - name: Run examples (Rust CLI)
        run: scripts/run-examples.sh --rust
