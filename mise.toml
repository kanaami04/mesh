# Mesh 開発に必要なツールのバージョン固定
# セットアップ: mise install

[tools]
bun = "1.3.9"   # playgroundの開発サーバー・型チェック(TS実装は2026-07-27に撤去済み)
node = "24"     # 生成された JavaScript の実行確認用
rust = "1.97.1" # Meshコンパイラ(rust/)のビルド。**これが本番実装**

[tasks.check]
description = "playgroundのTS型チェック(TS実装は2026-07-27に撤去済み)"
run = "bunx tsc --noEmit"

[tasks.playground]
description = "ブラウザプレイグラウンドを起動 (http://localhost:8765)"
# コンパイラはRust版のwasm(TS撤去 段階4)。起動前に必ずビルドし直す
# ——古いwasmのまま起動すると、直したはずのコンパイラの挙動が反映されず混乱するため
run = """
rustup target add wasm32-unknown-unknown 2>/dev/null || true
cargo build --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown --lib --release
bun playground/serve.ts
"""

[tasks."run-examples"]
description = "サンプルを全部実行して動作確認(--rust でRust版CLI)"
run = "scripts/run-examples.sh"

[tasks.sweep]
description = "組み合わせを機械的に作ってTS版と突き合わせる(parityが測れない「形の組み合わせ」用)"
run = "scripts/sweep.sh"

[tasks."rust-test"]
description = "コンパイラ本体のテスト(rust/)"
run = "cd rust && cargo test"

[tasks."rust-check"]
description = "コンパイラ本体のlint(clippy)"
run = "cd rust && cargo clippy --all-targets"

[tasks.parity]
description = "TS版(オラクル)とRust版のcheck出力を突き合わせる(誤検知があれば失敗)"
run = "scripts/parity.sh"

[tasks."parity-update"]
description = "parityコーパスのRust側期待出力を更新する(TS版と突き合わせたうえで書き換わる)"
run = "scripts/parity.sh --update"

[tasks.drift]
description = "自分の変更が偽にしたコメントの候補を出す(判定はしない)"
run = "scripts/drift.sh"
