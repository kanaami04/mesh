# Mesh 開発に必要なツールのバージョン固定
# セットアップ: mise install

[tools]
bun = "1.3.9"   # コンパイラの実行・テスト (bun test)
node = "24"     # 生成された JavaScript の実行確認用
rust = "1.97.1" # Rust移植版コンパイラ(rust/)のビルド

[tasks.test]
description = "コンパイラのテストを実行"
run = "bun test"

[tasks.check]
description = "TypeScript の型チェック"
run = "bunx tsc --noEmit"

[tasks.playground]
description = "ブラウザプレイグラウンドを起動 (http://localhost:8765)"
run = "bun playground/serve.ts"

[tasks."run-examples"]
description = "サンプルを全部実行して動作確認"
# **1本落ちても止めない**——`set -e`で打ち切られていたため、意図的にpanicする
# defer_panic.mesh(7本目)以降の17本が長らく一度も実行されていなかった(milestone 64で発覚)。
# 期待どおり落ちる例はEXPECT_FAILへ列挙し、それ以外の失敗があるときだけ非ゼロで終わる。
run = """
expect_fail="examples/defer_panic.mesh"   # deferの動作確認のため意図的にpanicする
failed=""
for f in examples/*.mesh; do
  echo "=== $f ==="
  if bun src/cli.ts run "$f"; then
    case " $expect_fail " in *" $f "*) failed="$failed $f(落ちるはずが成功)";; esac
  else
    case " $expect_fail " in *" $f "*) ;; *) failed="$failed $f";; esac
  fi
done
if [ -n "$failed" ]; then
  echo "[run-examples] 失敗:$failed"
  exit 1
fi
echo "[run-examples] $(ls examples/*.mesh | wc -l) 本すべて期待どおり"
"""

[tasks.sweep]
description = "組み合わせを機械的に作ってTS版と突き合わせる(parityが測れない「形の組み合わせ」用)"
run = "scripts/sweep.sh"

[tasks."rust-test"]
description = "Rust移植版のテスト(rust/)"
run = "cd rust && cargo test"

[tasks."rust-check"]
description = "Rust移植版のlint(clippy)"
run = "cd rust && cargo clippy --all-targets"

[tasks.parity]
description = "TS版(オラクル)とRust版のcheck出力を突き合わせる(誤検知があれば失敗)"
run = "scripts/parity.sh"

[tasks."parity-update"]
description = "parityコーパスのRust側期待出力を更新する(TS版と突き合わせたうえで書き換わる)"
run = "scripts/parity.sh --update"

[tasks.drift]
description = "自分の変更が偽にしたコメントの候補を出す(判定はしない)"
run = "scripts/drift.sh"
